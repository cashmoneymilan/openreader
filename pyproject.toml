[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "openreader-engine"
version = "0.0.1"
description = "Private Milestone 0 engine for the OpenReader document-to-device pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.17",
  "pytest>=8.4",
]

[project.scripts]
openreader = "openreader_engine.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
